<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robot MCP Simulation</title>
  <link rel="stylesheet" href="/chat_static/styles.css">
  <style>
    body {
      background: #0b1114;
    }

    .sim-shell {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 22px 80px;
    }

    .sim-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .sim-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .sim-brand .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      font-size: 12px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      text-decoration: none;
      background: rgba(17,25,30,.72);
    }

    .sim-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 20px;
    }

    .panel {
      background: rgba(17,25,30,.82);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 20px 50px rgba(0,0,0,.18);
    }

    .robot-panel {
      padding: 22px;
    }

    .robot-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .robot-title {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .robot-avatar {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      color: #0b1114;
      background: linear-gradient(135deg, var(--accent), #7dd9ff);
      font-size: 30px;
      box-shadow: 0 0 24px rgba(157,241,192,.2);
      animation: floatRobot 3s ease-in-out infinite;
    }

    .robot-name {
      margin: 0;
      font-size: clamp(24px, 2.4vw, 32px);
      letter-spacing: -0.04em;
    }

    .robot-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .mini-chip {
      display: inline-flex;
      align-items: center;
      padding: 6px 9px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      font: 10px 'DM Mono', monospace;
      background: rgba(11,17,20,.5);
    }

    .progress-box {
      margin-top: 10px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(11,17,20,.45);
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      color: var(--muted);
      font: 11px 'DM Mono', monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .progress-track {
      width: 100%;
      height: 12px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(132,145,156,.18);
    }

    .progress-fill {
      display: block;
      height: 100%;
      width: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), #7dd9ff);
      box-shadow: 0 0 18px rgba(157,241,192,.28);
      transition: width 0.8s ease;
    }

    .task-flow {
      margin-top: 24px;
      display: grid;
      gap: 12px;
    }

    .task-step {
      display: grid;
      grid-template-columns: 34px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(11,17,20,.35);
      opacity: 0.82;
    }

    .task-step.active {
      border-color: rgba(157,241,192,.5);
      background: rgba(157,241,192,.05);
      opacity: 1;
    }

    .task-step.completed {
      border-color: rgba(82,201,142,.4);
      background: rgba(82,201,142,.04);
    }

    .step-icon {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(132,145,156,.16);
      color: var(--muted);
      font-weight: 700;
    }

    .task-step.completed .step-icon {
      background: rgba(82,201,142,.18);
      color: var(--accent);
    }

    .task-step.active .step-icon {
      background: rgba(157,241,192,.18);
      color: var(--accent);
      animation: pulseDot 1.3s infinite;
    }

    .step-copy {
      min-width: 0;
    }

    .step-label {
      margin: 0;
      font-size: 14px;
      color: var(--ink);
    }

    .step-detail {
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .step-time {
      color: var(--faint);
      font: 11px 'DM Mono', monospace;
      white-space: nowrap;
    }

    .side-panel {
      display: grid;
      gap: 20px;
    }

    .info-panel {
      padding: 20px;
    }

    .panel-title {
      margin: 0 0 18px;
      color: var(--muted);
      font: 11px 'DM Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .value-stack {
      display: grid;
      gap: 12px;
    }

    .value-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }

    .value-row strong {
      color: var(--ink);
      font-weight: 600;
    }

    .log-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }

    .log-list li {
      position: relative;
      padding-left: 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .log-list li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 9px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(157,241,192,.08);
    }

    @keyframes floatRobot {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.7; }
    }

    @media (max-width: 860px) {
      .sim-grid {
        grid-template-columns: 1fr;
      }
      .sim-topbar {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="sim-shell">
    <div class="sim-topbar">
      <div class="sim-brand">
        <span class="brand-mark">6G</span>
        <span>MCP Robot Simulation</span>
      </div>
      <a class="back-link" href="/">← Back to chat</a>
    </div>

    <div class="sim-grid">
      <section class="panel robot-panel">
        <div class="robot-header">
          <div class="robot-title">
            <div class="robot-avatar" aria-label="Robot">🤖</div>
            <div>
              <h1 class="robot-name" id="robotName">Loading...</h1>
              <div class="robot-meta">
                <span class="mini-chip" id="robotStatus">Waiting</span>
                <span class="mini-chip" id="mcpTool">Tool: --</span>
              </div>
            </div>
          </div>
          <div class="mini-chip" id="batteryChip">Battery: --</div>
        </div>

        <div class="progress-box">
          <div class="progress-head">
            <span>Execution progress</span>
            <strong id="progressPercent">0%</strong>
          </div>
          <div class="progress-track"><span id="progressFill" class="progress-fill"></span></div>
        </div>

        <div class="task-flow" id="taskFlow"></div>
      </section>

      <aside class="side-panel">
        <section class="panel info-panel">
          <h2 class="panel-title">Task details</h2>
          <div class="value-stack">
            <div class="value-row"><span>Task ID</span><strong id="taskId">--</strong></div>
            <div class="value-row"><span>Current task</span><strong id="currentTask">--</strong></div>
            <div class="value-row"><span>Start time</span><strong id="startTime">--</strong></div>
            <div class="value-row"><span>End time</span><strong id="endTime">--</strong></div>
            <div class="value-row"><span>Location</span><strong id="robotLocation">--</strong></div>
            <div class="value-row"><span>Last update</span><strong id="lastUpdate">--</strong></div>
          </div>
        </section>

        <section class="panel info-panel">
          <h2 class="panel-title">Execution log</h2>
          <ul class="log-list" id="logList"></ul>
        </section>
      </aside>
    </div>
  </div>

  <script>
    const state = { activeStep: 0, timer: null };

    function updateStepView(steps) {
      const flow = document.getElementById('taskFlow');
      flow.innerHTML = steps.map((step, index) => {
        const isActive = index === state.activeStep;
        const isCompleted = index < state.activeStep;
        const icon = isCompleted ? '✓' : isActive ? '•' : '○';
        return `
          <div class="task-step ${isActive ? 'active' : ''} ${isCompleted ? 'completed' : ''}">
            <div class="step-icon">${icon}</div>
            <div class="step-copy">
              <p class="step-label">${step.label}</p>
              <div class="step-detail">${step.details}</div>
            </div>
            <div class="step-time">${step.time}</div>
          </div>
        `;
      }).join('');
    }

    async function loadSimulation() {
      const response = await fetch('/api/robot-simulation');
      const data = await response.json();

      document.getElementById('robotName').textContent = data.robot.name;
      document.getElementById('robotStatus').textContent = data.robot.status;
      document.getElementById('mcpTool').textContent = `Tool: ${data.robot.mcp_tool}`;
      document.getElementById('batteryChip').textContent = `Battery: ${data.robot.battery}`;
      document.getElementById('taskId').textContent = data.task.id;
      document.getElementById('currentTask').textContent = data.task.title;
      document.getElementById('startTime').textContent = data.task.start_time;
      document.getElementById('endTime').textContent = data.task.end_time;
      document.getElementById('robotLocation').textContent = data.robot.location;
      document.getElementById('lastUpdate').textContent = data.summary.last_update;
      document.getElementById('progressPercent').textContent = `${data.progress}%`;
      document.getElementById('progressFill').style.width = `${data.progress}%`;

      state.activeStep = data.active_step || 0;
      updateStepView(data.steps || []);

      const logList = document.getElementById('logList');
      logList.innerHTML = (data.logs || []).map((log) => `<li>${log}</li>`).join('');

      const stepList = data.steps || [];
      if (stepList.length > 0) {
        const current = stepList[state.activeStep];
        if (current) {
          document.getElementById('robotStatus').textContent = current.status === 'active' ? 'Executing' : current.status === 'completed' ? 'Completed' : 'Waiting';
        }
      }
    }

    loadSimulation();
    setInterval(loadSimulation, 5000);
  </script>
</body>
</html>
